name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          # Single source of truth for the SDK: global.json (rollForward:
          # latestPatch). dotnet-version + dotnet-quality could resolve a
          # different feature band than the pinned one and fail restore.
          global-json-file: global.json

      - name: Restore tests
        run: dotnet restore DailyPlanner.Tests/DailyPlanner.Tests.csproj --locked-mode

      - name: Restore main
        run: dotnet restore DailyPlanner/DailyPlanner.csproj -r win-x64 --locked-mode

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build DailyPlanner/DailyPlanner.csproj --no-restore -c Release -r win-x64

      - name: Test (with coverage)
        run: dotnet test DailyPlanner.Tests/DailyPlanner.Tests.csproj --no-restore -c Debug --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Publish
        run: dotnet publish DailyPlanner/DailyPlanner.csproj --no-build -c Release -r win-x64 --self-contained -o ./publish
